name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install nightly toolchain
      run: rustup toolchain install nightly --component clippy
    - name: Install stable toolchain
      run: rustup toolchain install stable --component llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Build lib
      run: cargo build --verbose --no-default-features
    - name: Build bin
      run: cargo build --verbose
    - name: Run tests with coverage
      run: cargo llvm-cov --lib --tests --examples --fail-under-lines 90
    - name: Run doctests
      run: cargo test --doc --verbose
    - name: Run lints
      run: cargo +nightly clippy --verbose --all-targets --all-features -- -D warnings
    - name: Check doc warnings
      run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  automerge:
    needs: [build]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # dependabot-triggered runs get a read-only token unless a job asks for more
    permissions:
      contents: write
      pull-requests: write

    steps:
    - run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
